<svg viewBox="0 0 470 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="470" height="560" rx="40" fill="#111114"/>
  <rect x="30" y="29" width="410" height="502" rx="34" fill="#000000" stroke="#2a2a30" stroke-width="1"/>
  <g transform="translate(30,29)">
    <!-- top info row (inset off the rounded corners) -->
    <text x="62" y="26" fill="#00c864" font-size="19">82%</text>
    <text x="205" y="27" fill="#00c8ff" font-size="20" text-anchor="middle">Hits 5</text>
    <text x="348" y="26" fill="#bebebe" font-size="19" text-anchor="end">14:32</text>

    <!-- scoreboard: game circles at the edges (OPP left, YOU right) -->
    <text x="60" y="55" fill="#c82d2d" font-size="16" text-anchor="middle">OPP</text>
    <circle cx="60" cy="95" r="34" fill="#161616" stroke="#c82d2d" stroke-width="3"/>
    <text x="60" y="108" fill="#ffffff" font-size="36" font-weight="bold" text-anchor="middle">2</text>
    <text x="350" y="55" fill="#1d9e55" font-size="16" text-anchor="middle">YOU</text>
    <circle cx="350" cy="95" r="34" fill="#161616" stroke="#1d9e55" stroke-width="3"/>
    <text x="350" y="108" fill="#ffffff" font-size="36" font-weight="bold" text-anchor="middle">4</text>

    <!-- enlarged 5-slice player ring, center 205,280 -->
    <g fill="none" stroke-width="86">
      <path d="M142.1 193.4 A107 107 0 0 1 267.9 193.4" stroke="#1d9e55"/>
      <path d="M267.9 193.4 A107 107 0 0 1 306.8 313.1" stroke="#e1c814"/>
      <path d="M306.8 313.1 A107 107 0 0 1 205.0 387.0" stroke="#eb7814"/>
      <path d="M205.0 387.0 A107 107 0 0 1 103.2 313.1" stroke="#c82d2d"/>
      <path d="M103.2 313.1 A107 107 0 0 1 142.1 193.4" stroke="#2d6ad8"/>
    </g>

    <!-- GOOD: check -->
    <polyline points="193,174 202,184 219,159" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="210" font-size="20" fill="#fff" text-anchor="middle">3</text>

    <!-- OUT: court + ball landed outside -->
    <g transform="translate(305.8,245)">
      <rect x="-18" y="-10" width="26" height="22" fill="none" stroke="#151515" stroke-width="3"/>
      <line x1="-5" y1="-10" x2="-5" y2="12" stroke="#151515" stroke-width="1.8"/>
      <circle cx="16" cy="-13" r="7" fill="#151515"/>
    </g>
    <text x="305.8" y="283" font-size="20" fill="#151515" text-anchor="middle">1</text>

    <!-- BAD: ball caught in the net -->
    <g transform="translate(267.9,364)" stroke="#fff" fill="none">
      <rect x="-18" y="-11" width="36" height="25" stroke-width="2.2"/>
      <line x1="-9" y1="-11" x2="-9" y2="14" stroke-width="1.2"/>
      <line x1="0" y1="-11" x2="0" y2="14" stroke-width="1.2"/>
      <line x1="9" y1="-11" x2="9" y2="14" stroke-width="1.2"/>
      <line x1="-18" y1="-3" x2="18" y2="-3" stroke-width="1.2"/>
      <line x1="-18" y1="6" x2="18" y2="6" stroke-width="1.2"/>
      <circle cx="0" cy="4" r="7" fill="#fff" stroke="none"/>
    </g>
    <text x="267.9" y="402" font-size="20" fill="#fff" text-anchor="middle">0</text>

    <!-- UNFORCED: X -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round">
      <line x1="131" y1="355" x2="153" y2="377"/>
      <line x1="153" y1="355" x2="131" y2="377"/>
    </g>
    <text x="142.1" y="402" font-size="20" fill="#fff" text-anchor="middle">2</text>

    <!-- ACE: serve bolt -->
    <polygon points="111,230 95,253 105,253 99,270 118,246 108,246" fill="#fff"/>
    <text x="104.2" y="283" font-size="20" fill="#fff" text-anchor="middle">5</text>

    <!-- center dial -->
    <circle cx="205" cy="280" r="64" fill="#161616" stroke="#444" stroke-width="2"/>
    <text x="205" y="291" fill="#bebebe" font-size="28" font-weight="bold" text-anchor="middle">PAUSE</text>

    <!-- opponent pair: headline on top, count on the inner side -->
    <rect x="16" y="434" width="182" height="62" rx="10" fill="#23252b"/>
    <rect x="16" y="434" width="182" height="4" rx="2" fill="#1d9e55"/>
    <text x="107" y="456" fill="#1d9e55" font-size="17" text-anchor="middle">OPP GOOD</text>
    <text x="42" y="488" fill="#1d9e55" font-size="26" text-anchor="middle">&#10003;</text>
    <text x="176" y="488" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">2</text>

    <rect x="212" y="434" width="182" height="62" rx="10" fill="#23252b"/>
    <rect x="212" y="434" width="182" height="4" rx="2" fill="#eb7814"/>
    <text x="303" y="456" fill="#eb7814" font-size="17" text-anchor="middle">OPP BAD</text>
    <text x="370" y="488" fill="#eb7814" font-size="26" text-anchor="middle">&#9888;</text>
    <text x="234" y="488" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">1</text>
  </g>
</svg>
