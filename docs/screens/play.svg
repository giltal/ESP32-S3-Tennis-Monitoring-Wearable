<svg viewBox="0 0 470 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="470" height="560" rx="40" fill="#111114"/>
  <rect x="30" y="29" width="410" height="502" rx="34" fill="#000000" stroke="#2a2a30" stroke-width="1"/>
  <g transform="translate(30,29)">
    <!-- top info row (inset off the rounded corners) -->
    <text x="62" y="26" fill="#00c864" font-size="19">82%</text>
    <text x="205" y="27" fill="#00c8ff" font-size="20" text-anchor="middle">Hits 5</text>
    <text x="348" y="26" fill="#bebebe" font-size="19" text-anchor="end">14:32</text>

    <!-- scoreboard: game circles at the edges (OPP left, YOU right) -->
    <text x="60" y="52" fill="#c82d2d" font-size="16" text-anchor="middle">OPP</text>
    <circle cx="60" cy="92" r="33" fill="#161616" stroke="#c82d2d" stroke-width="3"/>
    <text x="60" y="104" fill="#ffffff" font-size="34" font-weight="bold" text-anchor="middle">2</text>
    <text x="350" y="52" fill="#1d9e55" font-size="16" text-anchor="middle">YOU</text>
    <circle cx="350" cy="92" r="33" fill="#161616" stroke="#1d9e55" stroke-width="3"/>
    <text x="350" y="104" fill="#ffffff" font-size="34" font-weight="bold" text-anchor="middle">4</text>

    <!-- enlarged 5-slice player ring, center 205,270 -->
    <g fill="none" stroke-width="92">
      <path d="M138.0 177.8 A114 114 0 0 1 272.0 177.8" stroke="#1d9e55"/>
      <path d="M272.0 177.8 A114 114 0 0 1 313.4 305.2" stroke="#e1c814"/>
      <path d="M313.4 305.2 A114 114 0 0 1 205.0 384.0" stroke="#eb7814"/>
      <path d="M205.0 384.0 A114 114 0 0 1 96.6 305.2" stroke="#c82d2d"/>
      <path d="M96.6 305.2 A114 114 0 0 1 138.0 177.8" stroke="#2d6ad8"/>
    </g>

    <!-- GOOD: check -->
    <polyline points="192,158 202,169 221,141" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="196" font-size="21" fill="#fff" text-anchor="middle">3</text>

    <!-- OUT: court + ball landed outside -->
    <g transform="translate(311.5,233)">
      <rect x="-19" y="-11" width="28" height="24" fill="none" stroke="#151515" stroke-width="3"/>
      <line x1="-5" y1="-11" x2="-5" y2="13" stroke="#151515" stroke-width="2"/>
      <circle cx="18" cy="-14" r="7.5" fill="#151515"/>
    </g>
    <text x="311.5" y="273" font-size="21" fill="#151515" text-anchor="middle">1</text>

    <!-- BAD: ball caught in the net -->
    <g transform="translate(270.8,358)" stroke="#fff" fill="none">
      <rect x="-19" y="-12" width="38" height="27" stroke-width="2.4"/>
      <line x1="-10" y1="-12" x2="-10" y2="15" stroke-width="1.3"/>
      <line x1="0" y1="-12" x2="0" y2="15" stroke-width="1.3"/>
      <line x1="10" y1="-12" x2="10" y2="15" stroke-width="1.3"/>
      <line x1="-19" y1="-3" x2="19" y2="-3" stroke-width="1.3"/>
      <line x1="-19" y1="6" x2="19" y2="6" stroke-width="1.3"/>
      <circle cx="0" cy="4" r="7.5" fill="#fff" stroke="none"/>
    </g>
    <text x="270.8" y="398" font-size="21" fill="#fff" text-anchor="middle">0</text>

    <!-- UNFORCED: X -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round">
      <line x1="128" y1="349" x2="151" y2="372"/>
      <line x1="151" y1="349" x2="128" y2="372"/>
    </g>
    <text x="139.2" y="398" font-size="21" fill="#fff" text-anchor="middle">2</text>

    <!-- ACE: serve bolt -->
    <polygon points="105,218 88,242 99,242 92,260 112,235 101,235" fill="#fff"/>
    <text x="98.5" y="273" font-size="21" fill="#fff" text-anchor="middle">5</text>

    <!-- center dial -->
    <circle cx="205" cy="270" r="68" fill="#161616" stroke="#444" stroke-width="2"/>
    <text x="205" y="281" fill="#bebebe" font-size="30" font-weight="bold" text-anchor="middle">PAUSE</text>

    <!-- opponent pair: headline on top, icon pulled inner, count on the inner side -->
    <rect x="16" y="434" width="182" height="62" rx="10" fill="#23252b"/>
    <rect x="16" y="434" width="182" height="4" rx="2" fill="#1d9e55"/>
    <text x="107" y="456" fill="#1d9e55" font-size="17" text-anchor="middle">OPP GOOD</text>
    <text x="60" y="488" fill="#1d9e55" font-size="26" text-anchor="middle">&#10003;</text>
    <text x="176" y="488" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">2</text>

    <rect x="212" y="434" width="182" height="62" rx="10" fill="#23252b"/>
    <rect x="212" y="434" width="182" height="4" rx="2" fill="#eb7814"/>
    <text x="303" y="456" fill="#eb7814" font-size="17" text-anchor="middle">OPP BAD</text>
    <text x="350" y="488" fill="#eb7814" font-size="26" text-anchor="middle">&#9888;</text>
    <text x="234" y="488" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">1</text>
  </g>
</svg>
